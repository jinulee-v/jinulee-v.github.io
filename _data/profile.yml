short_bio: >-
  <p>
    Hi! I am Jinu Lee, a Ph.D. student in Computer Science at UIUC working on NLP/AI. I am fortunate to be advised by <a href="https://hmr-lab.github.io/">Julia Hockenmaier</a>.
  </p>
  <p>
    My research focuses on <b>understanding reasoning traces of large language models</b>. Specific topics include:
    <ul>
      <li>Understanding the text-level and mechanistic-level structures of LLM reasoning</li>
      <li>Evaluating and improving the reasoning capability of LLMs</li>
      <li>Trustworthy reasoning in high-stakes domains (e.g., law, tax, medicine, ...)</li>
    </ul>
  </p>
  <p>
    You can find my CV <a href="/assets/pdf/JinuLee_cv.pdf">here</a>.
  </p>

